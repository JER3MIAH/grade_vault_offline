name: grade_vault_offline
description: "A new Flutter project."

publish_to: "none"

version: 1.0.2+3

environment:
  sdk: ^3.10.7

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  flutter_riverpod: ^3.0.3
  hooks_riverpod: ^3.0.3
  flutter_hooks: ^0.21.0
  intl: ^0.20.2
  toolkit_core: ^0.3.3
  uuid: ^4.5.2
  pdf: ^3.11.3
  path_provider: ^2.1.5
  share_plus: ^12.0.1
  web: ^1.1.1
  file_picker: ^8.1.0
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  encrypt: ^5.0.3
  url_launcher: ^6.3.2
  image: ^4.5.4
  image_picker: ^1.2.1

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.3
  rename_app: ^1.6.5

flutter_launcher_icons:
  android: "ic_launcher"
  ios: true
  image_path_ios: "assets/app_icon.png"
  image_path_android: "assets/app_icon_no_bg.png"
  min_sdk_android: 21
  remove_alpha_ios: true
  web:
    generate: true
    image_path: "assets/app_icon_no_bg.png"
    background_color: "#ffffff"
    theme_color: "#0175C2"
  windows:
    generate: true
    image_path: "assets/app_icon_no_bg.png"
    icon_size: 48

flutter:
  uses-material-design: true

  assets:
    - assets/
    - assets/icons/

  fonts:
    - family: NotoSans
      fonts:
        - asset: assets/fonts/noto-sans/NotoSans-Thin.ttf
          weight: 100
        - asset: assets/fonts/noto-sans/NotoSans-ThinItalic.ttf
          weight: 100
          style: italic
        - asset: assets/fonts/noto-sans/NotoSans-ExtraLightItalic.ttf
          weight: 200
          style: italic
        - asset: assets/fonts/noto-sans/NotoSans-LightItalic.ttf
          weight: 300
          style: italic
        - asset: assets/fonts/noto-sans/NotoSans-Regular.ttf
          weight: 400
        - asset: assets/fonts/noto-sans/NotoSans-Italic.ttf
          weight: 400
          style: italic
        - asset: assets/fonts/noto-sans/NotoSans-Medium.ttf
          weight: 500
        - asset: assets/fonts/noto-sans/NotoSans-MediumItalic.ttf
          weight: 500
          style: italic
        - asset: assets/fonts/noto-sans/NotoSans-SemiBoldItalic.ttf
          weight: 600
          style: italic
        - asset: assets/fonts/noto-sans/NotoSans-Bold.ttf
          weight: 700
        - asset: assets/fonts/noto-sans/NotoSans-BoldItalic.ttf
          weight: 700
          style: italic
        - asset: assets/fonts/noto-sans/NotoSans-ExtraBold.ttf
          weight: 800
        - asset: assets/fonts/noto-sans/NotoSans-ExtraBoldItalic.ttf
          weight: 800
          style: italic
        - asset: assets/fonts/noto-sans/NotoSans-Black.ttf
          weight: 900
        - asset: assets/fonts/noto-sans/NotoSans-BlackItalic.ttf
          weight: 900
          style: italic
